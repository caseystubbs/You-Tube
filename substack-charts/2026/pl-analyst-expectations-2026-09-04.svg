<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Planet Labs analyst expectations</title>
  <desc id="desc">Selected recent analyst ratings and Planet Labs price targets, plus consensus range.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#050913"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102746"/><stop offset="1" stop-color="#091426"/></linearGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#4ea8ff" stroke-opacity=".08" stroke-width="2"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".4"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1450" cy="80" r="430" fill="#22d3ee" opacity=".05"/>
  <text x="800" y="82" text-anchor="middle" fill="#22d3ee" font-family="Arial" font-size="30" font-weight="800" letter-spacing="7">WALL STREET VIEW</text>
  <text x="800" y="150" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial" font-size="58" font-weight="900">ANALYSTS SEE UPSIDE — WITH A WIDE RANGE</text>
  <text x="800" y="198" text-anchor="middle" fill="#9fb2cc" font-family="Arial" font-size="28" font-weight="600">Consensus target: $34.56 • Low: $11 • High: $53</text>
  <rect x="640" y="222" width="320" height="7" rx="3.5" fill="#f5a524"/>

  <g font-family="Arial">
    <g transform="translate(80 300)"><rect width="270" height="360" rx="26" fill="url(#card)" stroke="#22d3ee" stroke-width="3"/><text x="135" y="62" text-anchor="middle" fill="#fff" font-size="26" font-weight="900">NEEDHAM</text><text x="135" y="130" text-anchor="middle" fill="#22e06b" font-size="25" font-weight="800">BUY</text><text x="135" y="230" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial" font-size="64" font-weight="900">$40</text><text x="135" y="285" text-anchor="middle" fill="#8ea9c9" font-size="19" font-weight="700">RECENT TARGET</text></g>
    <g transform="translate(372 300)"><rect width="270" height="360" rx="26" fill="url(#card)" stroke="#22d3ee" stroke-width="3"/><text x="135" y="62" text-anchor="middle" fill="#fff" font-size="26" font-weight="900">WEDBUSH</text><text x="135" y="130" text-anchor="middle" fill="#22e06b" font-size="25" font-weight="800">OUTPERFORM</text><text x="135" y="230" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial" font-size="64" font-weight="900">$50</text><text x="135" y="285" text-anchor="middle" fill="#8ea9c9" font-size="19" font-weight="700">RECENT TARGET</text></g>
    <g transform="translate(664 300)"><rect width="270" height="360" rx="26" fill="url(#card)" stroke="#22d3ee" stroke-width="3"/><text x="135" y="62" text-anchor="middle" fill="#fff" font-size="24" font-weight="900">CRAIG-HALLUM</text><text x="135" y="130" text-anchor="middle" fill="#22e06b" font-size="25" font-weight="800">BUY</text><text x="135" y="230" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial" font-size="64" font-weight="900">$49</text><text x="135" y="285" text-anchor="middle" fill="#8ea9c9" font-size="19" font-weight="700">RECENT TARGET</text></g>
    <g transform="translate(956 300)"><rect width="270" height="360" rx="26" fill="url(#card)" stroke="#28517c" stroke-width="3"/><text x="135" y="62" text-anchor="middle" fill="#fff" font-size="26" font-weight="900">BERENBERG</text><text x="135" y="130" text-anchor="middle" fill="#22e06b" font-size="25" font-weight="800">BUY</text><text x="135" y="230" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial" font-size="64" font-weight="900">$25</text><text x="135" y="285" text-anchor="middle" fill="#8ea9c9" font-size="19" font-weight="700">INITIATION</text></g>
    <g transform="translate(1248 300)"><rect width="270" height="360" rx="26" fill="url(#card)" stroke="#f5a524" stroke-width="3"/><text x="135" y="62" text-anchor="middle" fill="#fff" font-size="24" font-weight="900">GOLDMAN SACHS</text><text x="135" y="130" text-anchor="middle" fill="#f5a524" font-size="25" font-weight="800">NEUTRAL</text><text x="135" y="230" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial" font-size="64" font-weight="900">$25</text><text x="135" y="285" text-anchor="middle" fill="#8ea9c9" font-size="19" font-weight="700">RECENT TARGET</text></g>
  </g>
  <text x="80" y="760" fill="#fff" font-family="Arial" font-size="25" font-weight="800">FREEDOM INCOME OPTIONS</text>
  <text x="1520" y="760" text-anchor="end" fill="#8ea9c9" font-family="Arial" font-size="21" font-weight="700">TARGETS CAN CHANGE AFTER NEW RESULTS</text>
  <text x="800" y="825" text-anchor="middle" fill="#f5a524" font-family="Arial" font-size="22" font-weight="800">PRICE TARGETS ARE OPINIONS, NOT GUARANTEES</text>
</svg>
