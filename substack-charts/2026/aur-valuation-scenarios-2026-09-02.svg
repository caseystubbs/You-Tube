<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aurora valuation scenarios at 1.3 billion dollars in revenue</title>
  <desc id="desc">Four valuation scenarios showing implied market value and AUR share prices at two billion and 2.3 billion shares.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#050913"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102746"/>
      <stop offset="1" stop-color="#091426"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe781"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" fill="none" stroke="#4ea8ff" stroke-opacity=".08" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1450" cy="60" r="420" fill="#22d3ee" opacity=".045"/>
  <circle cx="70" cy="850" r="360" fill="#f5a524" opacity=".045"/>

  <text x="800" y="82" text-anchor="middle" fill="#22d3ee" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="7">AUR VALUATION DEEP DIVE</text>
  <text x="800" y="150" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="58" font-weight="900">WHAT COULD AUR BE WORTH?</text>
  <text x="800" y="198" text-anchor="middle" fill="#a9bdd6" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Illustrative scenarios at $1.3 billion in annual revenue</text>
  <rect x="620" y="224" width="360" height="7" rx="3.5" fill="url(#gold)"/>

  <g transform="translate(80 275)" filter="url(#shadow)">
    <rect width="700" height="220" rx="26" fill="url(#card)" stroke="#294a70" stroke-width="3"/>
    <rect x="0" y="0" width="118" height="220" rx="26" fill="#0b3154"/>
    <rect x="92" y="0" width="26" height="220" fill="#0b3154"/>
    <text x="59" y="102" text-anchor="middle" fill="url(#gold)" font-family="Arial Black, Arial" font-size="55" font-weight="900">5×</text>
    <text x="59" y="140" text-anchor="middle" fill="#9fc9e8" font-family="Arial" font-size="20" font-weight="700">SALES</text>
    <text x="150" y="58" fill="#7f9ab9" font-family="Arial" font-size="19" font-weight="700" letter-spacing="2">MARKET VALUE</text>
    <text x="150" y="102" fill="#ffffff" font-family="Arial Black, Arial" font-size="38" font-weight="900">$6.5B</text>
    <line x1="150" y1="126" x2="650" y2="126" stroke="#294a70" stroke-width="2"/>
    <text x="150" y="162" fill="#7f9ab9" font-family="Arial" font-size="19" font-weight="700">PRICE @ 2.0B SHARES</text>
    <text x="380" y="164" fill="#22e06b" font-family="Arial Black, Arial" font-size="30" font-weight="900">$3.25</text>
    <text x="150" y="202" fill="#7f9ab9" font-family="Arial" font-size="19" font-weight="700">PRICE @ 2.3B SHARES</text>
    <text x="380" y="204" fill="#ffffff" font-family="Arial Black, Arial" font-size="30" font-weight="900">$2.83</text>
  </g>

  <g transform="translate(820 275)" filter="url(#shadow)">
    <rect width="700" height="220" rx="26" fill="url(#card)" stroke="#2a7990" stroke-width="3"/>
    <rect x="0" y="0" width="118" height="220" rx="26" fill="#0b3b4d"/>
    <rect x="92" y="0" width="26" height="220" fill="#0b3b4d"/>
    <text x="59" y="102" text-anchor="middle" fill="url(#gold)" font-family="Arial Black, Arial" font-size="55" font-weight="900">10×</text>
    <text x="59" y="140" text-anchor="middle" fill="#9fc9e8" font-family="Arial" font-size="20" font-weight="700">SALES</text>
    <text x="150" y="58" fill="#7f9ab9" font-family="Arial" font-size="19" font-weight="700" letter-spacing="2">MARKET VALUE</text>
    <text x="150" y="102" fill="#ffffff" font-family="Arial Black, Arial" font-size="38" font-weight="900">$13.0B</text>
    <line x1="150" y1="126" x2="650" y2="126" stroke="#294a70" stroke-width="2"/>
    <text x="150" y="162" fill="#7f9ab9" font-family="Arial" font-size="19" font-weight="700">PRICE @ 2.0B SHARES</text>
    <text x="380" y="164" fill="#22e06b" font-family="Arial Black, Arial" font-size="30" font-weight="900">$6.50</text>
    <text x="150" y="202" fill="#7f9ab9" font-family="Arial" font-size="19" font-weight="700">PRICE @ 2.3B SHARES</text>
    <text x="380" y="204" fill="#ffffff" font-family="Arial Black, Arial" font-size="30" font-weight="900">$5.65</text>
  </g>

  <g transform="translate(80 530)" filter="url(#shadow)">
    <rect width="700" height="220" rx="26" fill="url(#card)" stroke="#2a7990" stroke-width="3"/>
    <rect x="0" y="0" width="118" height="220" rx="26" fill="#0b3b4d"/>
    <rect x="92" y="0" width="26" height="220" fill="#0b3b4d"/>
    <text x="59" y="102" text-anchor="middle" fill="url(#gold)" font-family="Arial Black, Arial" font-size="55" font-weight="900">15×</text>
    <text x="59" y="140" text-anchor="middle" fill="#9fc9e8" font-family="Arial" font-size="20" font-weight="700">SALES</text>
    <text x="150" y="58" fill="#7f9ab9" font-family="Arial" font-size="19" font-weight="700" letter-spacing="2">MARKET VALUE</text>
    <text x="150" y="102" fill="#ffffff" font-family="Arial Black, Arial" font-size="38" font-weight="900">$19.5B</text>
    <line x1="150" y1="126" x2="650" y2="126" stroke="#294a70" stroke-width="2"/>
    <text x="150" y="162" fill="#7f9ab9" font-family="Arial" font-size="19" font-weight="700">PRICE @ 2.0B SHARES</text>
    <text x="380" y="164" fill="#22e06b" font-family="Arial Black, Arial" font-size="30" font-weight="900">$9.75</text>
    <text x="150" y="202" fill="#7f9ab9" font-family="Arial" font-size="19" font-weight="700">PRICE @ 2.3B SHARES</text>
    <text x="380" y="204" fill="#ffffff" font-family="Arial Black, Arial" font-size="30" font-weight="900">$8.48</text>
  </g>

  <g transform="translate(820 530)" filter="url(#shadow)">
    <rect width="700" height="220" rx="26" fill="url(#card)" stroke="#f5a524" stroke-width="3"/>
    <rect x="0" y="0" width="118" height="220" rx="26" fill="#4b3511"/>
    <rect x="92" y="0" width="26" height="220" fill="#4b3511"/>
    <text x="59" y="102" text-anchor="middle" fill="url(#gold)" font-family="Arial Black, Arial" font-size="55" font-weight="900">20×</text>
    <text x="59" y="140" text-anchor="middle" fill="#f3cc7e" font-family="Arial" font-size="20" font-weight="700">SALES</text>
    <text x="150" y="58" fill="#7f9ab9" font-family="Arial" font-size="19" font-weight="700" letter-spacing="2">MARKET VALUE</text>
    <text x="150" y="102" fill="#ffffff" font-family="Arial Black, Arial" font-size="38" font-weight="900">$26.0B</text>
    <line x1="150" y1="126" x2="650" y2="126" stroke="#294a70" stroke-width="2"/>
    <text x="150" y="162" fill="#7f9ab9" font-family="Arial" font-size="19" font-weight="700">PRICE @ 2.0B SHARES</text>
    <text x="380" y="164" fill="#22e06b" font-family="Arial Black, Arial" font-size="30" font-weight="900">$13.00</text>
    <text x="150" y="202" fill="#7f9ab9" font-family="Arial" font-size="19" font-weight="700">PRICE @ 2.3B SHARES</text>
    <text x="380" y="204" fill="#ffffff" font-family="Arial Black, Arial" font-size="30" font-weight="900">$11.30</text>
  </g>

  <text x="80" y="826" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">FREEDOM INCOME OPTIONS</text>
  <text x="1520" y="826" text-anchor="end" fill="#f5a524" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">ILLUSTRATIVE SCENARIOS — NOT A PRICE PREDICTION</text>
</svg>
