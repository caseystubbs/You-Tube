<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Planet Labs valuation scenarios at one billion dollars in revenue</title>
  <desc id="desc">Three sales multiple scenarios showing potential share prices at 365, 400, and 450 million shares.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset=".55" stop-color="#0a1830"/><stop offset="1" stop-color="#050913"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102746"/><stop offset="1" stop-color="#091426"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe781"/><stop offset="1" stop-color="#f5a524"/></linearGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#4ea8ff" stroke-opacity=".08" stroke-width="2"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1450" cy="60" r="420" fill="#22d3ee" opacity=".045"/><circle cx="70" cy="850" r="360" fill="#f5a524" opacity=".045"/>
  <text x="800" y="82" text-anchor="middle" fill="#22d3ee" font-family="Arial" font-size="30" font-weight="800" letter-spacing="7">PL VALUATION DEEP DIVE</text>
  <text x="800" y="150" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial" font-size="58" font-weight="900">WHAT COULD $1 BILLION SUPPORT?</text>
  <text x="800" y="198" text-anchor="middle" fill="#a9bdd6" font-family="Arial" font-size="29" font-weight="600">Illustrative market-cap-to-sales scenarios at different future share counts</text>
  <rect x="620" y="224" width="360" height="7" rx="3.5" fill="url(#gold)"/>

  <g font-family="Arial">
    <g transform="translate(80 285)">
      <rect width="450" height="430" rx="28" fill="url(#card)" stroke="#294a70" stroke-width="3"/>
      <text x="225" y="78" text-anchor="middle" fill="url(#gold)" font-family="Arial Black, Arial" font-size="58" font-weight="900">5× SALES</text>
      <text x="225" y="118" text-anchor="middle" fill="#8ea9c9" font-size="20" font-weight="800">$5.0B MARKET VALUE</text>
      <line x1="45" y1="150" x2="405" y2="150" stroke="#294a70" stroke-width="2"/>
      <text x="48" y="205" fill="#8ea9c9" font-size="20" font-weight="800">365M SHARES</text><text x="402" y="208" text-anchor="end" fill="#fff" font-family="Arial Black, Arial" font-size="34" font-weight="900">$13.70</text>
      <text x="48" y="280" fill="#8ea9c9" font-size="20" font-weight="800">400M SHARES</text><text x="402" y="283" text-anchor="end" fill="#fff" font-family="Arial Black, Arial" font-size="34" font-weight="900">$12.50</text>
      <text x="48" y="355" fill="#8ea9c9" font-size="20" font-weight="800">450M SHARES</text><text x="402" y="358" text-anchor="end" fill="#f5a524" font-family="Arial Black, Arial" font-size="34" font-weight="900">$11.11</text>
    </g>
    <g transform="translate(575 265)">
      <rect width="450" height="470" rx="28" fill="url(#card)" stroke="#22d3ee" stroke-width="5"/>
      <rect x="123" y="-22" width="204" height="46" rx="23" fill="#22d3ee"/><text x="225" y="10" text-anchor="middle" fill="#07101f" font-size="20" font-weight="900">BASE CASE</text>
      <text x="225" y="98" text-anchor="middle" fill="url(#gold)" font-family="Arial Black, Arial" font-size="58" font-weight="900">8× SALES</text>
      <text x="225" y="138" text-anchor="middle" fill="#8ea9c9" font-size="20" font-weight="800">$8.0B MARKET VALUE</text>
      <line x1="45" y1="170" x2="405" y2="170" stroke="#294a70" stroke-width="2"/>
      <text x="48" y="225" fill="#8ea9c9" font-size="20" font-weight="800">365M SHARES</text><text x="402" y="228" text-anchor="end" fill="#22e06b" font-family="Arial Black, Arial" font-size="34" font-weight="900">$21.92</text>
      <text x="48" y="300" fill="#8ea9c9" font-size="20" font-weight="800">400M SHARES</text><text x="402" y="303" text-anchor="end" fill="#fff" font-family="Arial Black, Arial" font-size="34" font-weight="900">$20.00</text>
      <text x="48" y="375" fill="#8ea9c9" font-size="20" font-weight="800">450M SHARES</text><text x="402" y="378" text-anchor="end" fill="#f5a524" font-family="Arial Black, Arial" font-size="34" font-weight="900">$17.78</text>
    </g>
    <g transform="translate(1070 285)">
      <rect width="450" height="430" rx="28" fill="url(#card)" stroke="#f5a524" stroke-width="3"/>
      <text x="225" y="78" text-anchor="middle" fill="url(#gold)" font-family="Arial Black, Arial" font-size="58" font-weight="900">12× SALES</text>
      <text x="225" y="118" text-anchor="middle" fill="#8ea9c9" font-size="20" font-weight="800">$12.0B MARKET VALUE</text>
      <line x1="45" y1="150" x2="405" y2="150" stroke="#294a70" stroke-width="2"/>
      <text x="48" y="205" fill="#8ea9c9" font-size="20" font-weight="800">365M SHARES</text><text x="402" y="208" text-anchor="end" fill="#22e06b" font-family="Arial Black, Arial" font-size="34" font-weight="900">$32.88</text>
      <text x="48" y="280" fill="#8ea9c9" font-size="20" font-weight="800">400M SHARES</text><text x="402" y="283" text-anchor="end" fill="#fff" font-family="Arial Black, Arial" font-size="34" font-weight="900">$30.00</text>
      <text x="48" y="355" fill="#8ea9c9" font-size="20" font-weight="800">450M SHARES</text><text x="402" y="358" text-anchor="end" fill="#f5a524" font-family="Arial Black, Arial" font-size="34" font-weight="900">$26.67</text>
    </g>
  </g>
  <text x="80" y="825" fill="#fff" font-family="Arial" font-size="25" font-weight="800">FREEDOM INCOME OPTIONS</text>
  <text x="1520" y="825" text-anchor="end" fill="#f5a524" font-family="Arial" font-size="23" font-weight="800">ILLUSTRATIVE — NOT A PRICE PREDICTION</text>
</svg>
