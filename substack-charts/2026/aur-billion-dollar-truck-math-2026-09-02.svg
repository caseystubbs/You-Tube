<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How many trucks Aurora needs for one billion dollars in revenue</title>
  <desc id="desc">Three utilization scenarios using 85 cents of Driver as a Service revenue per mile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#050913"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102746"/><stop offset="1" stop-color="#091426"/></linearGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#4ea8ff" stroke-opacity=".08" stroke-width="2"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1480" cy="100" r="430" fill="#22d3ee" opacity=".05"/>
  <text x="800" y="82" text-anchor="middle" fill="#22d3ee" font-family="Arial" font-size="30" font-weight="800" letter-spacing="7">THE ROAD TO $1 BILLION</text>
  <text x="800" y="150" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial" font-size="58" font-weight="900">HOW MANY TRUCKS WOULD AURORA NEED?</text>
  <text x="800" y="198" text-anchor="middle" fill="#9fb2cc" font-family="Arial" font-size="28" font-weight="600">Illustrative DaaS scenarios at $0.85 per mile</text>
  <rect x="640" y="222" width="320" height="7" rx="3.5" fill="#f5a524"/>

  <g font-family="Arial" filter="url(#shadow)">
    <g transform="translate(90 300)"><rect width="440" height="390" rx="28" fill="url(#card)" stroke="#28517c" stroke-width="3"/><text x="220" y="72" text-anchor="middle" fill="#22d3ee" font-family="Arial Black, Arial" font-size="47" font-weight="900">200,000</text><text x="220" y="110" text-anchor="middle" fill="#8ea9c9" font-size="21" font-weight="800">MILES PER TRUCK</text><line x1="45" y1="145" x2="395" y2="145" stroke="#294a70" stroke-width="2"/><text x="220" y="205" text-anchor="middle" fill="#8ea9c9" font-size="20" font-weight="800">ANNUAL REVENUE PER TRUCK</text><text x="220" y="265" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial" font-size="46" font-weight="900">$170,000</text><text x="220" y="326" text-anchor="middle" fill="#f5a524" font-family="Arial Black, Arial" font-size="49" font-weight="900">5,882</text><text x="220" y="360" text-anchor="middle" fill="#8ea9c9" font-size="20" font-weight="800">TRUCKS FOR $1B</text></g>
    <g transform="translate(580 275)"><rect width="440" height="440" rx="28" fill="url(#card)" stroke="#22d3ee" stroke-width="5"/><rect x="118" y="-22" width="204" height="46" rx="23" fill="#22d3ee"/><text x="220" y="10" text-anchor="middle" fill="#07101f" font-size="20" font-weight="900">BASE CASE</text><text x="220" y="92" text-anchor="middle" fill="#22d3ee" font-family="Arial Black, Arial" font-size="47" font-weight="900">225,000</text><text x="220" y="130" text-anchor="middle" fill="#8ea9c9" font-size="21" font-weight="800">MILES PER TRUCK</text><line x1="45" y1="165" x2="395" y2="165" stroke="#294a70" stroke-width="2"/><text x="220" y="225" text-anchor="middle" fill="#8ea9c9" font-size="20" font-weight="800">ANNUAL REVENUE PER TRUCK</text><text x="220" y="285" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial" font-size="46" font-weight="900">$191,250</text><text x="220" y="356" text-anchor="middle" fill="#22e06b" font-family="Arial Black, Arial" font-size="55" font-weight="900">5,229</text><text x="220" y="394" text-anchor="middle" fill="#8ea9c9" font-size="20" font-weight="800">TRUCKS FOR $1B</text></g>
    <g transform="translate(1070 300)"><rect width="440" height="390" rx="28" fill="url(#card)" stroke="#28517c" stroke-width="3"/><text x="220" y="72" text-anchor="middle" fill="#22d3ee" font-family="Arial Black, Arial" font-size="47" font-weight="900">250,000</text><text x="220" y="110" text-anchor="middle" fill="#8ea9c9" font-size="21" font-weight="800">MILES PER TRUCK</text><line x1="45" y1="145" x2="395" y2="145" stroke="#294a70" stroke-width="2"/><text x="220" y="205" text-anchor="middle" fill="#8ea9c9" font-size="20" font-weight="800">ANNUAL REVENUE PER TRUCK</text><text x="220" y="265" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial" font-size="46" font-weight="900">$212,500</text><text x="220" y="326" text-anchor="middle" fill="#f5a524" font-family="Arial Black, Arial" font-size="49" font-weight="900">4,706</text><text x="220" y="360" text-anchor="middle" fill="#8ea9c9" font-size="20" font-weight="800">TRUCKS FOR $1B</text></g>
  </g>
  <text x="80" y="825" fill="#fff" font-family="Arial" font-size="25" font-weight="800">FREEDOM INCOME OPTIONS</text>
  <text x="1520" y="825" text-anchor="end" fill="#f5a524" font-family="Arial" font-size="23" font-weight="800">ILLUSTRATIVE MODEL — NOT COMPANY GUIDANCE</text>
</svg>
