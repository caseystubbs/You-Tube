<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Planet Labs five-year illustrative revenue roadmap</title>
  <desc id="desc">Revenue grows from 307.7 million dollars in fiscal 2026 to an illustrative one billion dollars in fiscal 2031.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#050913"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1478a0"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="barGold" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8d5f12"/><stop offset="1" stop-color="#f5a524"/></linearGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#4ea8ff" stroke-opacity=".08" stroke-width="2"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1450" cy="70" r="430" fill="#22d3ee" opacity=".05"/>
  <text x="800" y="82" text-anchor="middle" fill="#22d3ee" font-family="Arial" font-size="30" font-weight="800" letter-spacing="7">PL GROWTH ROADMAP</text>
  <text x="800" y="150" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial" font-size="58" font-weight="900">A POSSIBLE PATH TO $1 BILLION</text>
  <text x="800" y="198" text-anchor="middle" fill="#9fb2cc" font-family="Arial" font-size="27" font-weight="600">FY2026 actual • FY2027 management midpoint • FY2028–FY2031 illustrative</text>
  <rect x="640" y="222" width="320" height="7" rx="3.5" fill="#f5a524"/>

  <g transform="translate(100 276)" font-family="Arial">
    <line x1="0" y1="430" x2="1400" y2="430" stroke="#31516f" stroke-width="3"/>
    <line x1="0" y1="320" x2="1400" y2="320" stroke="#31516f" stroke-opacity=".45" stroke-width="2"/>
    <line x1="0" y1="210" x2="1400" y2="210" stroke="#31516f" stroke-opacity=".45" stroke-width="2"/>
    <line x1="0" y1="100" x2="1400" y2="100" stroke="#31516f" stroke-opacity=".45" stroke-width="2"/>
    <text x="0" y="94" fill="#7f9ab9" font-size="20" font-weight="700">$1.0B</text>
    <text x="0" y="204" fill="#7f9ab9" font-size="20" font-weight="700">$750M</text>
    <text x="0" y="314" fill="#7f9ab9" font-size="20" font-weight="700">$500M</text>

    <g>
      <rect x="120" y="295" width="150" height="135" rx="16" fill="#294a70"/>
      <rect x="342" y="238" width="150" height="192" rx="16" fill="url(#barGold)"/>
      <rect x="564" y="177" width="150" height="253" rx="16" fill="url(#bar)"/>
      <rect x="786" y="122" width="150" height="308" rx="16" fill="url(#bar)"/>
      <rect x="1008" y="56" width="150" height="374" rx="16" fill="url(#bar)"/>
      <rect x="1230" y="0" width="150" height="430" rx="16" fill="url(#bar)"/>
    </g>

    <g text-anchor="middle" font-family="Arial Black, Arial" font-weight="900">
      <text x="195" y="275" fill="#fff" font-size="32">$307.7M</text>
      <text x="417" y="218" fill="#f5a524" font-size="32">$435.5M</text>
      <text x="639" y="157" fill="#fff" font-size="32">$575M</text>
      <text x="861" y="102" fill="#fff" font-size="32">$700M</text>
      <text x="1083" y="36" fill="#fff" font-size="32">$850M</text>
      <text x="1305" y="-20" fill="#22e06b" font-size="34">$1.0B</text>
    </g>
    <g text-anchor="middle" font-size="22" font-weight="800">
      <text x="195" y="472" fill="#9fb2cc">FY2026</text><text x="195" y="503" fill="#7f9ab9" font-size="18">ACTUAL</text>
      <text x="417" y="472" fill="#f5a524">FY2027</text><text x="417" y="503" fill="#f3cc7e" font-size="18">GUIDE MIDPOINT</text>
      <text x="639" y="472" fill="#9fb2cc">FY2028</text><text x="639" y="503" fill="#7f9ab9" font-size="18">ILLUSTRATIVE</text>
      <text x="861" y="472" fill="#9fb2cc">FY2029</text><text x="861" y="503" fill="#7f9ab9" font-size="18">ILLUSTRATIVE</text>
      <text x="1083" y="472" fill="#9fb2cc">FY2030</text><text x="1083" y="503" fill="#7f9ab9" font-size="18">ILLUSTRATIVE</text>
      <text x="1305" y="472" fill="#22e06b">FY2031</text><text x="1305" y="503" fill="#7f9ab9" font-size="18">ILLUSTRATIVE</text>
    </g>
  </g>
  <text x="80" y="825" fill="#fff" font-family="Arial" font-size="25" font-weight="800">FREEDOM INCOME OPTIONS</text>
  <text x="1520" y="825" text-anchor="end" fill="#f5a524" font-family="Arial" font-size="23" font-weight="800">~23% FY2027–FY2031 CAGR REQUIRED</text>
</svg>
