<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three Trade Setups — Wait for Confirmation</title>
  <desc id="desc">A dark navy and gold finance thumbnail featuring QQQ, NVDA, and SOFI with candlestick charts and a caution symbol.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030812"/>
      <stop offset="0.52" stop-color="#071a35"/>
      <stop offset="1" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a1"/>
      <stop offset="0.35" stop-color="#ffd52f"/>
      <stop offset="1" stop-color="#d88900"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b54" stop-opacity=".96"/>
      <stop offset="1" stop-color="#06101f" stop-opacity=".96"/>
    </linearGradient>
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#2d6da8" stroke-opacity=".16" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1240" cy="420" rx="500" ry="500" fill="#005bcb" opacity=".10"/>
  <ellipse cx="260" cy="100" rx="400" ry="240" fill="#f8b500" opacity=".07"/>

  <g opacity=".88">
    <path d="M910 640 C1010 565 1035 480 1110 515 S1240 350 1320 405 S1445 215 1545 260" fill="none" stroke="#25a9ff" stroke-width="9" filter="url(#blueGlow)"/>
    <g stroke-linecap="round">
      <g stroke="#35c8ff" fill="#0d5e92"><path d="M965 585v-120" stroke-width="6"/><rect x="948" y="500" width="34" height="58" stroke-width="4"/></g>
      <g stroke="#ffd331" fill="#915f00"><path d="M1040 545v-128" stroke-width="6"/><rect x="1023" y="455" width="34" height="64" stroke-width="4"/></g>
      <g stroke="#35c8ff" fill="#0d5e92"><path d="M1120 505v-146" stroke-width="6"/><rect x="1103" y="395" width="34" height="78" stroke-width="4"/></g>
      <g stroke="#35c8ff" fill="#0d5e92"><path d="M1200 455v-162" stroke-width="6"/><rect x="1183" y="330" width="34" height="88" stroke-width="4"/></g>
      <g stroke="#ffd331" fill="#915f00"><path d="M1280 430v-168" stroke-width="6"/><rect x="1263" y="296" width="34" height="92" stroke-width="4"/></g>
      <g stroke="#ffd331" fill="#915f00"><path d="M1360 390v-158" stroke-width="6"/><rect x="1343" y="270" width="34" height="80" stroke-width="4"/></g>
      <g stroke="#35c8ff" fill="#0d5e92"><path d="M1440 328v-172" stroke-width="6"/><rect x="1423" y="196" width="34" height="90" stroke-width="4"/></g>
    </g>
  </g>

  <text x="78" y="120" fill="#66cfff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="8">MEMBER TRADE WATCHLIST</text>
  <text x="70" y="315" fill="url(#gold)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="190" font-weight="900" filter="url(#goldGlow)">3 TRADE</text>
  <text x="72" y="470" fill="#ffffff" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="155" font-weight="900">SETUPS</text>
  <rect x="75" y="520" width="775" height="12" rx="6" fill="url(#gold)"/>
  <text x="78" y="605" fill="#ffd52f" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="2">WAIT FOR CONFIRMATION</text>

  <g transform="translate(80 680)">
    <rect width="250" height="120" rx="22" fill="url(#panel)" stroke="#2eafff" stroke-width="5" filter="url(#blueGlow)"/>
    <text x="125" y="82" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Arial" font-size="70" font-weight="900">QQQ</text>
  </g>
  <g transform="translate(365 680)">
    <rect width="250" height="120" rx="22" fill="url(#panel)" stroke="#ffd52f" stroke-width="5" filter="url(#goldGlow)"/>
    <text x="125" y="82" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Arial" font-size="66" font-weight="900">NVDA</text>
  </g>
  <g transform="translate(650 680)">
    <rect width="250" height="120" rx="22" fill="url(#panel)" stroke="#25dfc2" stroke-width="5" filter="url(#blueGlow)"/>
    <text x="125" y="82" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Arial" font-size="70" font-weight="900">SOFI</text>
  </g>

  <g transform="translate(1210 625)" filter="url(#goldGlow)">
    <path d="M0 170 170-135 340 170Z" fill="#13100a" stroke="url(#gold)" stroke-width="28" stroke-linejoin="round"/>
    <rect x="154" y="-38" width="32" height="118" rx="16" fill="#ffd52f"/>
    <circle cx="170" cy="125" r="21" fill="#ffd52f"/>
  </g>
</svg>
