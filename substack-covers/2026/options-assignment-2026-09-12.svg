  <rect x="82" y="323" width="735" height="132" rx="8" fill="#F5A524"/>
  <text x="108" y="426" fill="#0A0F1C" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="112" font-weight="900">NOW WHAT?</text>
  <text x="92" y="520" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="700">It’s not a failed trade — it’s part of the plan.</text>

