    <text x="1160" y="365" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">STATUS</text>
    <text x="1390" y="365" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">SHARES</text>
    <line x1="940" y1="390" x2="1470" y2="390" stroke="#334155" stroke-width="2"/>

