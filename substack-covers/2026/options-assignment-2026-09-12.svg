    <text x="1170" y="451" fill="#0A0F1C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900">ASSIGNED</text>
    <text x="1395" y="452" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">100</text>

