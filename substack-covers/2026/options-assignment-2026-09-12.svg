    <text x="950" y="555" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">OKLO</text>
    <rect x="1138" y="512" width="180" height="56" rx="11" fill="#22E06B"/>
    <text x="1171" y="550" fill="#052E16" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900">EXPIRED</text>
    <text x="1420" y="550" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="34">—</text>

    <line x1="940" y1="595" x2="1470" y2="595" stroke="#1E293B" stroke-width="2"/>
    <text x="950" y="655" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">NBIS</text>
    <rect x="1138" y="612" width="180" height="56" rx="11" fill="#22E06B"/>
    <text x="1171" y="650" fill="#052E16" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900">EXPIRED</text>
    <text x="1420" y="650" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="34">—</text>
