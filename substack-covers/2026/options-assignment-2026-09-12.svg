  <image href="https://freedomincomeoptions.com/static/fio-light-logo.png" x="92" y="748" width="280" height="90" preserveAspectRatio="xMidYMid meet"/>
  <text x="1490" y="830" text-anchor="end" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22">FOR EDUCATIONAL PURPOSES ONLY. NOT FINANCIAL ADVICE.</text>
