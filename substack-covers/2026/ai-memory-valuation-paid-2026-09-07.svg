  <text x="92" y="622" fill="#ffffff" font-family="Arial Black,Arial,sans-serif" font-size="76" font-weight="900">TOO LATE TO BUY?</text>
  <text x="96" y="692" fill="#b9cbe0" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="600">Growth is exploding. Valuation is the harder question.</text>
