<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#0A0F1C"/>
  <rect width="1600" height="12" fill="#22D3EE"/>
  <text x="90" y="92" fill="#22D3EE" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" letter-spacing="4">INVESTING LESSON</text>
  <text x="90" y="170" fill="#F8FAFC" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="70" font-weight="900">A LOWER PRICE IS <tspan fill="#F5A524">NOT ENOUGH</tspan></text>
  <text x="90" y="222" fill="#94A3B8" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">The business still has to make sense.</text>
  <rect x="70" y="285" width="700" height="455" rx="24" fill="#111827" stroke="#1F6F4A" stroke-width="3"/>
  <rect x="70" y="285" width="700" height="78" rx="24" fill="#22E06B"/><rect x="70" y="335" width="700" height="28" fill="#22E06B"/>
  <text x="420" y="342" text-anchor="middle" fill="#062E1E" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="39" font-weight="900">CHEAPER STOCK</text>
  <text x="420" y="406" text-anchor="middle" fill="#CBD5E1" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800">SAME OR STRONGER BUSINESS</text>
  <polyline points="145,505 230,492 315,488 400,480 485,486 570,472 655,468" fill="none" stroke="#22E06B" stroke-width="7" stroke-dasharray="16 12"/>
  <polyline points="145,498 210,525 275,553 340,565 405,610 470,622 535,650 600,681 655,700" fill="none" stroke="#4EA8FF" stroke-width="8"/>
  <text x="525" y="470" fill="#22E06B" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800">Fair value holds</text>
  <text x="520" y="653" fill="#4EA8FF" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800">Price falls</text>
  <text x="120" y="715" fill="#22E06B" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900">POTENTIAL OPPORTUNITY</text>
  <rect x="830" y="285" width="700" height="455" rx="24" fill="#111827" stroke="#7A4C13" stroke-width="3"/>
  <rect x="830" y="285" width="700" height="78" rx="24" fill="#F5A524"/><rect x="830" y="335" width="700" height="28" fill="#F5A524"/>
  <text x="1180" y="342" text-anchor="middle" fill="#0A0F1C" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="39" font-weight="900">WEAKER BUSINESS</text>
  <text x="1180" y="406" text-anchor="middle" fill="#CBD5E1" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800">FAIR VALUE IS FALLING TOO</text>
  <polyline points="905,495 980,515 1055,540 1130,565 1205,590 1280,615 1355,645 1430,672" fill="none" stroke="#F5A524" stroke-width="7" stroke-dasharray="16 12"/>
  <polyline points="905,500 970,528 1035,556 1100,582 1165,620 1230,642 1295,670 1360,696 1430,718" fill="none" stroke="#4EA8FF" stroke-width="8"/>
  <text x="1290" y="590" fill="#F5A524" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800">Fair value falls</text>
  <text x="1290" y="672" fill="#4EA8FF" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800">Price falls</text>
  <text x="880" y="715" fill="#F5A524" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900">POSSIBLE VALUE TRAP</text>
  <rect x="210" y="780" width="1180" height="72" rx="16" fill="#F5A524"/>
  <text x="800" y="827" text-anchor="middle" fill="#0A0F1C" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="34" font-weight="900">A LOWER PRICE ONLY HELPS IF THE THESIS STILL HOLDS.</text>
</svg>