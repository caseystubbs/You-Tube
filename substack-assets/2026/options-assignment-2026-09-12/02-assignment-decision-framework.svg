<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#0A0F1C"/><rect width="1600" height="12" fill="#22D3EE"/>
<text x="100" y="105" fill="#22D3EE" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" letter-spacing="4">CASEY’S ASSIGNMENT FRAMEWORK</text>
<text x="100" y="190" fill="#fff" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="68" font-weight="900">ASSIGNMENT IS A DECISION TREE</text>
<text x="100" y="245" fill="#94A3B8" font-family="Arial,Helvetica,sans-serif" font-size="30">The plan should exist before the put is sold.</text>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="100" y="330" width="230" height="110" rx="18" fill="#172033" stroke="#22D3EE" stroke-width="3"/><text x="215" y="375" text-anchor="middle" fill="#22D3EE" font-size="24" font-weight="800">1</text><text x="215" y="410" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">ASSIGNED</text><line x1="330" y1="385" x2="410" y2="385" stroke="#475569" stroke-width="7"/>
<rect x="420" y="315" width="280" height="140" rx="18" fill="#172033" stroke="#334155" stroke-width="3"/><text x="560" y="365" text-anchor="middle" fill="#F5A524" font-size="24" font-weight="800">2</text><text x="560" y="405" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">STILL WANT</text><text x="560" y="438" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">THE COMPANY?</text><line x1="700" y1="385" x2="780" y2="385" stroke="#475569" stroke-width="7"/>
<rect x="790" y="315" width="280" height="140" rx="18" fill="#172033" stroke="#334155" stroke-width="3"/><text x="930" y="365" text-anchor="middle" fill="#F5A524" font-size="24" font-weight="800">3</text><text x="930" y="405" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">IS THE THESIS</text><text x="930" y="438" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">STILL INTACT?</text><line x1="1070" y1="385" x2="1150" y2="385" stroke="#475569" stroke-width="7"/>
<rect x="1160" y="315" width="340" height="140" rx="18" fill="#172033" stroke="#334155" stroke-width="3"/><text x="1330" y="365" text-anchor="middle" fill="#22E06B" font-size="24" font-weight="800">4</text><text x="1330" y="405" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">RECALCULATE</text><text x="1330" y="438" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">EFFECTIVE COST</text>
<rect x="100" y="540" width="1400" height="165" rx="24" fill="#111827" stroke="#1E293B" stroke-width="3"/><text x="140" y="590" fill="#22D3EE" font-size="24" font-weight="800" letter-spacing="2">THEN CHOOSE THE NEXT DECISION — DON’T DEFAULT TO ONE</text>
<rect x="140" y="625" width="280" height="58" rx="12" fill="#0F2A1D" stroke="#22E06B" stroke-width="2"/><text x="280" y="663" text-anchor="middle" fill="#22E06B" font-size="27" font-weight="900">HOLD SHARES</text>
<rect x="450" y="625" width="300" height="58" rx="12" fill="#111F33" stroke="#4EA8FF" stroke-width="2"/><text x="600" y="663" text-anchor="middle" fill="#4EA8FF" font-size="27" font-weight="900">COVERED CALL</text>
<rect x="780" y="625" width="300" height="58" rx="12" fill="#201A0D" stroke="#F5A524" stroke-width="2"/><text x="930" y="663" text-anchor="middle" fill="#F5A524" font-size="27" font-weight="900">ADD SHARES</text>
<rect x="1110" y="625" width="300" height="58" rx="12" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/><text x="1260" y="663" text-anchor="middle" fill="#E2E8F0" font-size="27" font-weight="900">EXIT</text>
<text x="100" y="775" fill="#fff" font-size="34" font-weight="900">Premium collected ≠ realized profit.</text><text x="100" y="820" fill="#94A3B8" font-size="27">The option outcome changes the position. It does not make the next decision for you.</text>
<text x="1500" y="842" text-anchor="end" fill="#F5A524" font-size="25" font-weight="800">FREEDOM INCOME OPTIONS</text>
</g></svg>